<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- 1. Import a cute, rounded font from Google Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      width: 300px;
      padding: 15px;
      background-color: #fdf1f4; 
      font-family: 'Nunito', sans-serif;
      color: #d24e6f; 
    }

    h3 {
      margin-top: 0;
      color: #f56d86; 
    }

    .input-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px;
      border: 2px solid #ffccd5;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      outline: none;
    }
    
    input[type="text"]:focus {
      border-color: #fb5573;
    }

    #add-btn {
      padding: 8px 12px;
      background-color: #ffb3c1;
      border: none;
      border-radius: 8px;
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: bold;
      cursor: pointer;
    }

    #add-btn:hover {
      background-color: #ff758f;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: rgba(231, 139, 139, 0.79); /* Semi-transparent white backing for tasks */
      padding: 6px 10px;
      border-radius: 8px;
    }

    input[type="checkbox"] {
      accent-color: #f9a4b5;
      cursor: pointer;
    }

    label {
      cursor: pointer;
      flex: 1;
    }

    input[type="checkbox"]:checked + label {
      text-decoration: line-through;
      color: #f0b4c9;
    }
  </style>
</head>
<body>

  <h3>what would  you like to do today?</h3>
  
  <div class="input-container">
    <input type="text" id="task-input" placeholder="Type a new task...">
    <button id="add-btn">Add</button>
  </div>

  <ul id="checklist"></ul>

  <script src="window.js"></script>
</body>
</html>
